  <body class="bg-[#140203] text-white antialiased selection:bg-[#ffb703] selection:text-black" oncontextmenu="return false;">
    <div id="root"></div>

    <!-- Security & Anti-Inspection Guard (Source code protection & anti-zoom) -->
    <script>
      (function() {
        // 1. Prevent Right-Click Context Menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        }, { capture: true });

        // 2. Prevent Keyboard Source Code Inspection Shortcuts
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+U or Cmd+U (View Source)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U' || e.keyCode === 85)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+Shift+I / J / C (DevTools & Console)
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (
            e.key === 'I' || e.key === 'i' || e.keyCode === 73 ||
            e.key === 'J' || e.key === 'j' || e.keyCode === 74 ||
            e.key === 'C' || e.key === 'c' || e.keyCode === 67
          )) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+S / Cmd+S (Save Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.keyCode === 83)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
          // Ctrl+P / Cmd+P (Print Page)
          if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P' || e.keyCode === 80)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, { capture: true });

        // 3. Prevent Mobile Pinch-to-Zoom & Double-Tap Zoom
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
          var now = (new Date()).getTime();
          if (now - lastTouchEnd <= 300) {
            e.preventDefault();
          }
          lastTouchEnd = now;
        }, false);

        document.addEventListener('touchmove', function(e) {
          if (e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // 4. Console Protection Notice
        try {
          console.log('%cLivexWin Security Protection Active', 'color: #f59e0b; font-size: 16px; font-weight: bold;');
          console.log('%cProprietary & Confidential - Unauthorized code inspection or reproduction is strictly prohibited.', 'color: #ef4444; font-size: 11px;');
        } catch(err) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
