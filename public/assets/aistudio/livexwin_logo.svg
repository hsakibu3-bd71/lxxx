<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="50%" stop-color="#e60012"/>
      <stop offset="100%" stop-color="#b8000e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffcc00"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- live -->
    <text x="20" y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="82" fill="url(#redGrad)" letter-spacing="-3">live</text>

    <!-- Stylized X: Left Red Crescent -->
    <path d="M 188 38 C 215 50 225 80 170 115 C 205 95 210 65 188 38 Z" fill="url(#redGrad)"/>

    <!-- Stylized X: Right Gold Crescent crossing over -->
    <path d="M 175 110 C 215 75 255 45 328 20 C 255 40 215 80 175 110 Z" fill="url(#goldGrad)"/>

    <!-- win -->
    <text x="272" y="98" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="82" fill="url(#redGrad)" letter-spacing="-3">win</text>
  </g>
</svg>